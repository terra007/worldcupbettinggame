<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06130d">
<meta name="description" content="WM 2026 Tipp-Pool">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WM26 Pool">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<title>WM 2026 Tipp-Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06130d; --bg2:#081d13; --panel:#0c2418; --panel2:#0f2d1e;
    --line:rgba(182,255,58,.14); --line2:rgba(182,255,58,.28);
    --ink:#f1f7ef; --mut:#8fae9c; --mut2:#5e7a69;
    --lime:#b6ff3a; --lime-d:#8fdb1f; --coral:#ff5a3c; --sky:#46d6ff; --gold:#ffd23c;
    --display:'Anton','Arial Narrow',sans-serif;
    --body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
    --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 85% -8%, rgba(182,255,58,.10), transparent 60%),
      radial-gradient(700px 500px at -5% 8%, rgba(70,214,255,.07), transparent 60%),
      radial-gradient(800px 600px at 50% 120%, rgba(255,90,60,.07), transparent 60%),
      var(--bg);
    padding: 0 0 calc(80px + env(safe-area-inset-bottom, 0px));
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;
    background-image:repeating-linear-gradient(90deg,transparent,transparent 78px,rgba(255,255,255,.012) 78px,rgba(255,255,255,.012) 79px);}
  .wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:0 16px}

  /* HEADER */
  header{padding:26px 0 14px}
  .header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
  .kicker{font-family:var(--body);font-weight:800;letter-spacing:.32em;font-size:11px;color:var(--lime);text-transform:uppercase}
  h1{font-family:var(--display);font-size:clamp(40px,11vw,76px);line-height:.86;letter-spacing:.01em;text-transform:uppercase;margin:6px 0 2px}
  h1 .pop{color:var(--lime)}
  .poolname{font-weight:700;color:var(--ink);font-size:15px;margin-top:8px}
  .poolname span{color:var(--mut)}
  .me-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--mut)}
  .me-chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:999px;color:var(--ink);font-weight:700}
  .me-chip b{color:var(--lime)}

  /* LANG SWITCHER */
  .lang-sw{display:flex;gap:4px;align-items:center;flex-shrink:0}
  .lang-btn{background:none;border:1px solid var(--line);color:var(--mut);font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:.1em;padding:4px 9px;border-radius:999px;cursor:pointer;transition:.15s;touch-action:manipulation}
  .lang-btn.active{background:var(--lime);color:#06130d;border-color:var(--lime)}
  .lang-btn:hover:not(.active){color:var(--ink);border-color:var(--line2)}

  .countdown{margin-top:14px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:var(--r);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .countdown .lab{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);font-weight:800}
  .countdown .nm{font-weight:800;font-size:14.5px;margin-top:3px}
  .countdown .clk{font-family:var(--display);font-size:30px;letter-spacing:.02em;color:var(--lime);white-space:nowrap}
  .countdown .clk.small{font-size:17px;color:var(--gold)}

  /* LOBBY */
  .pool-card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:.15s;touch-action:manipulation}
  .pool-card:hover,.pool-card:active{border-color:var(--line2)}
  .pool-card .pc-name{font-weight:800;font-size:15px}
  .pool-card .pc-meta{font-size:12px;color:var(--mut);margin-top:3px}
  .pool-card .pc-arr{font-family:var(--display);font-size:20px;color:var(--lime)}
  .invite-code{font-family:var(--display);font-size:32px;letter-spacing:.12em;color:var(--lime);text-align:center;padding:10px 0 6px}
  .back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--mut);font-family:var(--body);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0;margin-bottom:4px;touch-action:manipulation}
  .back-btn:hover{color:var(--ink)}

  /* TABS */
  nav.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;padding:12px 0 10px;margin-top:6px;
    background:linear-gradient(180deg,var(--bg) 65%,transparent);overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;font-family:var(--body);font-weight:800;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--mut);background:var(--panel);border:1px solid var(--line);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.18s;touch-action:manipulation}
  .tab:hover{color:var(--ink);border-color:var(--line2)}
  .tab.active{color:#06130d;background:var(--lime);border-color:var(--lime)}

  /* FILTER CHIPS */
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 16px}
  .chip{font-weight:800;font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line);padding:6px 11px;border-radius:8px;cursor:pointer;transition:.15s;touch-action:manipulation}
  .chip.active{color:#06130d;background:var(--lime-d);border-color:var(--lime-d)}
  .toggle{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);font-weight:700;cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--lime);width:15px;height:15px}

  /* MATCH CARD */
  .day-h{font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 2px 9px;display:flex;align-items:center;gap:10px}
  .day-h::after{content:"";flex:1;height:1px;background:var(--line)}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:11px;position:relative;overflow:hidden}
  .card .meta{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--mut);font-weight:700;margin-bottom:11px}
  .gbadge{font-family:var(--display);font-size:12px;letter-spacing:.04em;color:#06130d;background:var(--lime);border-radius:6px;padding:2px 8px;line-height:1.5}
  .time{color:var(--sky)}
  .status{margin-left:auto;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:6px;font-weight:800}
  .status.open{color:var(--lime);border:1px solid var(--line2)}
  .status.locked{color:var(--mut2);border:1px solid rgba(255,255,255,.08)}
  .status.live{color:var(--coral);border:1px solid rgba(255,90,60,.4);background:rgba(255,90,60,.08)}
  .status.done{color:var(--gold);border:1px solid rgba(255,210,60,.35)}
  .match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .team{display:flex;align-items:center;gap:9px;min-width:0}
  .team.away{flex-direction:row-reverse;text-align:right}
  .flag{flex-shrink:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
  .flag img{width:28px;height:auto;border-radius:2px;display:block}
  .tname{font-weight:800;font-size:15.5px;line-height:1.05;overflow:hidden;text-overflow:ellipsis}
  .vs{font-family:var(--display);color:var(--mut2);font-size:13px;padding:0 2px}
  .betrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:13px}
  .score-in{width:54px;height:52px;text-align:center;font-family:var(--display);font-size:28px;color:var(--ink);
    background:#071710;border:1.5px solid var(--line2);border-radius:12px;outline:none;transition:.15s;
    -moz-appearance:textfield;appearance:textfield}
  .score-in::-webkit-outer-spin-button,.score-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .score-in::placeholder{color:var(--mut2)}
  .score-in:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(182,255,58,.15)}
  .score-in:disabled{opacity:.7;color:var(--mut)}
  .dash{color:var(--mut2);font-family:var(--display);font-size:22px}
  .save{background:var(--lime);color:#06130d;border:none;font-family:var(--body);font-weight:800;font-size:13px;padding:0 16px;height:52px;border-radius:12px;cursor:pointer;letter-spacing:.02em;transition:.15s;touch-action:manipulation}
  .save:hover{background:#cdff63}
  .save.saved{background:var(--panel);color:var(--lime);border:1px solid var(--line2);cursor:default}
  .save:disabled{opacity:.45;cursor:not-allowed}
  .result-line{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;flex-wrap:wrap}
  .pill{font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
  .pill .lab{color:var(--mut);font-weight:700;margin-right:6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  .pill.you{color:var(--ink)}
  .pill.final{color:var(--gold);border-color:rgba(255,210,60,.35)}
  .pts{font-family:var(--display);font-size:15px;padding:5px 12px;border-radius:8px}
  .pts.p3{color:#06130d;background:var(--lime)}
  .pts.p1{color:#06130d;background:var(--gold)}
  .pts.p0{color:var(--mut);border:1px solid var(--line)}
  .nobet{color:var(--mut2);font-size:12.5px;font-style:italic}
  .pool-tips{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tips-label{width:100%;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:800;margin-bottom:2px}
  .tip-chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px}
  .tip-chip.mine{border-color:var(--line2);background:var(--panel)}
  .tip-chip .tip-nm{color:var(--mut);font-weight:700;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tip-chip .tip-sc{font-family:var(--display);font-size:13px}
  .tip-chip .tip-no{color:var(--mut2)}
  .tip-chip .pts{font-size:10px;padding:2px 6px}

  /* LEADERBOARD */
  .lb{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .lb-row{display:grid;grid-template-columns:46px 1fr auto auto;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .lb-row:last-child{border-bottom:none}
  .lb-row.head{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:800;padding:11px 16px}
  .rank{font-family:var(--display);font-size:24px;color:var(--mut2);text-align:center}
  .lb-row:nth-child(2) .rank{color:var(--lime)}
  .lb-row:nth-child(3) .rank{color:var(--sky)}
  .lb-row:nth-child(4) .rank{color:var(--coral)}
  .lb-name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-name .meflag{color:var(--lime);font-size:12px;margin-left:6px;font-weight:800}
  .lb-sub{font-size:11px;color:var(--mut);font-weight:600;text-align:right}
  .lb-pts{font-family:var(--display);font-size:26px;color:var(--lime);text-align:right;min-width:46px}

  /* GENERIC PANEL */
  .pnl{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
  .pnl h2{font-family:var(--display);font-size:22px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:12px}
  .pnl h2 .em{color:var(--lime)}
  .pnl p{color:var(--mut);font-size:14px;line-height:1.6;margin-bottom:10px}
  .pnl p b{color:var(--ink)}
  .rule{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
  .rule .b{font-family:var(--display);font-size:20px;border-radius:8px;padding:3px 11px;flex:0 0 auto}
  .rule .t{font-size:13.5px;line-height:1.5;color:var(--ink)}
  .rule .t span{color:var(--mut)}
  input.txt{width:100%;background:#071710;border:1.5px solid var(--line2);border-radius:10px;color:var(--ink);
    font-family:var(--body);font-weight:700;font-size:15px;padding:12px 14px;outline:none;margin-bottom:0}
  input.txt:focus{border-color:var(--lime)}
  .btn{background:var(--lime);color:#06130d;border:none;font-family:var(--body);font-weight:800;font-size:14px;
    padding:12px 20px;border-radius:10px;cursor:pointer;letter-spacing:.02em;transition:.15s;touch-action:manipulation}
  .btn:hover{background:#cdff63}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
  .btn.ghost:hover{background:var(--panel)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .row-in{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .hint{font-size:12.5px;color:var(--mut2);margin-top:10px;line-height:1.5}
  .gap{height:10px}

  /* MODAL */
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(2,8,5,.82);backdrop-filter:blur(6px)}
  .modal.show{display:flex}
  .modal .box{width:100%;max-width:420px;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line2);border-radius:20px;padding:26px}
  .modal h3{font-family:var(--display);font-size:30px;letter-spacing:.02em;text-transform:uppercase;line-height:.95;margin-bottom:8px}
  .modal h3 .em{color:var(--lime)}
  .modal p{color:var(--mut);font-size:13.5px;line-height:1.5;margin-bottom:16px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:200;
    background:var(--lime);color:#06130d;font-weight:800;font-size:14px;padding:12px 20px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;color:var(--mut);padding:40px 10px;font-size:14px}
  .empty .big{font-family:var(--display);font-size:30px;color:var(--mut2);margin-bottom:8px;letter-spacing:.04em}
  .foot{text-align:center;color:var(--mut2);font-size:11px;margin-top:24px;line-height:1.6}
  .team-search-wrap{margin-bottom:14px}
  .team-search{width:100%;box-sizing:border-box;background:#071710;border:1.5px solid var(--line2);border-radius:10px;color:var(--ink);font-family:var(--body);font-size:13px;font-weight:700;padding:9px 13px;outline:none;transition:.15s}
  .team-search:focus{border-color:var(--lime)}
  .team-search::placeholder{color:var(--mut2)}
  .ko-row{display:flex;align-items:center;gap:7px;padding:8px 0;border-top:1px solid var(--line)}
  .ko-row .txt{height:38px;padding:6px 10px;font-size:13px}
  .ko-row .btn{height:38px;padding:0 14px;font-size:12px}
  .mypicks-summary{display:flex;gap:10px;margin-bottom:18px}
  .mps-item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;text-align:center;flex:1;min-width:0}
  .mps-val{font-family:var(--display);font-size:26px;color:var(--lime)}
  .mps-lab{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--mut);font-weight:800;margin-top:3px}
  .mypick-card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:8px}
  .mpc-teams{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
  .mpc-name{font-weight:800;font-size:14px;line-height:1.1}
  .mpc-vs{color:var(--mut2);font-size:11px;font-family:var(--display);padding:0 2px}
  .mpc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mpc-pending{color:var(--mut);font-size:12px;font-style:italic}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="header-top">
      <div class="kicker" id="kicker">FIFA Weltmeisterschaft · USA · Kanada · Mexiko</div>
      <div class="lang-sw">
        <button class="lang-btn active" id="langDe">DE</button>
        <button class="lang-btn" id="langEn">EN</button>
      </div>
    </div>
    <h1 id="h1main">WORLD CUP <span class="pop">2026</span><br>TIPP-POOL</h1>
    <div class="poolname" id="poolName"><span id="poolsLbl">Pools:</span> World Cup 2026</div>
    <div class="me-bar" id="meBar"></div>
    <div class="countdown" id="cd" style="display:none">
      <div><div class="lab" id="cdLab">Anstoß-Countdown · nächstes Spiel</div><div class="nm" id="cdName">—</div></div>
      <div class="clk" id="cdClock">--:--:--</div>
    </div>
  </header>

  <!-- LOBBY -->
  <div id="view-lobby">
    <div id="lobby-content"></div>
  </div>

  <!-- POOL -->
  <div id="view-pool" style="display:none">
    <button class="back-btn" id="backBtn">← Alle Pools</button>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="matches">Spiele</button>
      <button class="tab" data-tab="mypicks">Meine Tipps</button>
      <button class="tab" data-tab="board">Rangliste</button>
      <button class="tab" data-tab="rules">Regeln</button>
      <button class="tab" data-tab="invite">Einladen</button>
      <button class="tab" data-tab="org">Organisator</button>
    </nav>
    <section id="view-matches"></section>
    <section id="view-mypicks" style="display:none"></section>
    <section id="view-board" style="display:none"></section>
    <section id="view-rules" style="display:none"></section>
    <section id="view-invite" style="display:none"></section>
    <section id="view-org" style="display:none"></section>
  </div>

  <div class="foot" id="foot" style="display:none"></div>
</div>

<div class="modal" id="nameModal">
  <div class="box">
    <h3 id="modalH3">POOL <span class="em">BEITRETEN</span></h3>
    <p id="modalP">Wähle den Namen, den deine Freunde kennen. <b>Du kannst ihn nach dem Beitreten nicht mehr ändern</b> — wähle sorgfältig.</p>
    <input class="txt" id="nameInput" placeholder="z.B. Max" maxlength="22" autocomplete="off">
    <div class="gap"></div><div class="gap"></div>
    <button class="btn" id="nameGo" style="width:100%">Weiter →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ── Translations ─────────────────────────────────────────── */
var lang;
try{lang=JSON.parse(localStorage.getItem("wm26_lang"))||"de";}catch(e){lang="de";}

var LANG={
de:{
  title:"WM 2026 Tipp-Pool",
  kicker:"FIFA Weltmeisterschaft · USA · Kanada · Mexiko",
  h1_line2:"TIPP-POOL",
  pools_prefix:"Pools:",
  pool_prefix:"Pool:",
  cd_lab:"Anstoß-Countdown · nächstes Spiel",
  tz_default:"Lokale Zeitzone",
  tz_foot:"Anstoßzeiten in {{tz}}. Tipps werden bei Spielbeginn gesperrt.",
  modal_h3:"POOL {em}BEITRETEN{/em}",
  modal_p:"Wähle den Namen, den deine Freunde kennen. <b>Du kannst ihn nach dem Beitreten nicht mehr ändern</b> — wähle sorgfältig.",
  name_ph:"z.B. Max",
  let_me_in:"Weiter →",
  joining_lbl:"Beitreten…",
  creating_lbl:"Erstellen…",
  tab_matches:"Spiele",
  tab_mypicks:"Meine Tipps",
  tab_board:"Rangliste",
  tab_rules:"Regeln",
  tab_invite:"Einladen",
  tab_org:"Organisator",
  back_btn:"← Alle Pools",
  playing_as:"Spielend als",
  players_in_pool:"Spieler im Pool",
  player_in_pool:"Spieler im Pool",
  your_pools:"Deine Pools",
  no_pools_big:"Noch keine Pools",
  no_pools_sub:"Tritt einem Pool bei oder erstelle deinen eigenen.",

function t(k,vars){
  var s=(LANG[lang]||LANG.de)[k];
  if(s===undefined) s=(LANG.de)[k];
  if(s===undefined) s=k;
  if(vars) Object.keys(vars).forEach(function(vk){s=s.replace("{{"+vk+"}}",vars[vk]);});
  return s;
}
function th(k,vars){
  return t(k,vars).replace(/\{em\}(.*?)\{\/em\}/g,'<span class="em">$1</span>');
}

function errMsg(e){
  var msg=e&&e.message?e.message:String(e);
  return ERR_MAP[msg]?t(ERR_MAP[msg]):msg;
}

/* ── API helpers ──────────────────────────────────────────── */
var API="/api/kv";
async function apiGet(p){
  var qs=Object.entries(p).map(function(e){return e[0]+"="+encodeURIComponent(e[1]);}).join("&");
  var r=await fetch(API+"?"+qs,{cache:"no-store"});
  if(!r.ok){var e=await r.json().catch(function(){return{};});throw new Error(e.error||"api "+r.status);}
  return r.json();
}
async function apiPost(body){
  var r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){var e=await r.json().catch(function(){return{};});throw new Error(e.error||"api "+r.status);}
  return r.json();
}
function pget(k){try{return Promise.resolve(JSON.parse(localStorage.getItem("wm26_"+k)));}catch(e){return Promise.resolve(null);}}
function pset(k,v){try{localStorage.setItem("wm26_"+k,JSON.stringify(v));}catch(e){}}

/* ── Helpers ──────────────────────────────────────────────── */
var $=function(s,r){return (r||document).querySelector(s);};
var fl=function(n){
  var c=ISO[n];
  if(!c) return '<img src="https://flagcdn.com/w40/un.png" width="28" height="auto" alt="" style="border-radius:2px">';
  return '<img src="https://flagcdn.com/w40/'+c+'.png" width="28" height="auto" alt="'+esc(n)+'" style="border-radius:2px">';
};
function fmtDay(ts){
  var locale=lang==="de"?"de-DE":"en-US";
  return new Date(ts).toLocaleDateString(locale,{weekday:"long",day:"numeric",month:"long"});
}
function fmtTime(ts){
  var locale=lang==="de"?"de-DE":"en-US";
  return new Date(ts).toLocaleTimeString(locale,{hour:"2-digit",minute:"2-digit"});
}
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var toastT;
function rn(m,s){return (matchOverrides[m.id]||{})[s]||m[s];}
function genUUID(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){
    var r=crypto.getRandomValues(new Uint8Array(1))[0]%16;
    return(c==="x"?r:(r&3|8)).toString(16);
  });
}
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},2200);}
function scorePoints(bet,res){
  if(!bet||!res) return null;
  var bd=bet.h-bet.a, rd=res.h-res.a;
  if(bet.h===res.h&&bet.a===res.a) return 3;
  if(Math.sign(bd)===Math.sign(rd)) return 1;
  return 0;
}

/* ── Init & routing ───────────────────────────────────────── */
async function init(){
  try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||t("tz_default");}catch(e){tz=t("tz_default");}
  applyStaticLang();
  updateFoot();
  $("#langDe").classList.toggle("active",lang==="de");
  $("#langEn").classList.toggle("active",lang==="en");
  me=await pget("me");
  myToken=await pget("token");
  var urlPool=new URLSearchParams(window.location.search).get("p");
  if(!me){
    if(urlPool) pset("pendingPool",urlPool);
    showNameModal();
    return;
  }
  if(!myToken){
    try{
      var tok=genUUID();
      var r=await apiPost({action:"register",name:me,token:tok});
      myToken=r.token||tok; pset("token",myToken);
    }catch(e){
      if(e.message&&e.message.includes("taken")){me=null;pset("me",null);showNameModal();return;}
    }
  }
  await route(urlPool);
}

async function route(poolCode){
  if(poolCode){
    try{
      await apiPost({action:"joinPool",inviteCode:poolCode,playerName:me});
      var pool=await apiGet({action:"poolByCode",code:poolCode});
      currentPool={id:pool.id,name:pool.name,inviteCode:pool.invite_code,ownerName:pool.owner_name};
      await enterPool();
    }catch(e){
      toast(t("toast_pool_not_found"));
      history.replaceState({},"",(new URL(window.location.href)).pathname);
      await showLobby();
    }
  } else {
    await showLobby();
  }
}

/* ── Countdown ────────────────────────────────────────────── */
function tickCountdown(){
  var now=Date.now(), nxt=null;
  for(var i=0;i<MATCHES.length;i++){if(MATCHES[i].kt>now){nxt=MATCHES[i];break;}}
  var cd=$("#cd");
  if(!nxt){cd.style.display="none";return;}
  cd.style.display="flex";
  $("#cdName").innerHTML=fl(nxt.h)+" "+esc(nxt.h)+" v "+esc(nxt.a)+" "+fl(nxt.a);
  var diff=Math.max(0,nxt.kt-now),s=Math.floor(diff/1000);
  var d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),ss=s%60;
  var clk=$("#cdClock");
  if(d>0){clk.classList.add("small");clk.textContent=d+"d "+h+"h "+m+"m";}
  else{clk.classList.remove("small");clk.textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");}
}

/* ── Matches ──────────────────────────────────────────────── */
function renderMatches(){
  var v=$("#view-matches"),now=Date.now();
  var hadSearchFocus=document.activeElement&&document.activeElement.classList.contains("team-search");
  var groups=["ALL","A","B","C","D","E","F","G","H","I","J","K","L","R32","R16","QF","SF","3P","FIN"];
  var html='<div class="filters">';
  var KO={R32:t("ko_R32"),R16:t("ko_R16"),QF:t("ko_QF"),SF:t("ko_SF"),"3P":t("ko_3P"),FIN:t("ko_FIN")};
  groups.forEach(function(g){html+='<button class="chip'+(grpFilter===g?" active":"")+'" data-g="'+g+'">'+(g==="ALL"?t("all_filter"):(KO[g]||t("grp_prefix")+g))+'</button>';});
  html+='<label class="toggle"><input type="checkbox" id="hideChk"'+(hideStarted?" checked":"")+'> '+esc(t("hide_started"))+'</label></div>';
  html+='<div class="team-search-wrap"><input class="team-search" type="text" placeholder="'+esc(t("search_team_ph"))+'" value="'+esc(teamFilter)+'"></div>';
  var tf=teamFilter.toLowerCase();
  var list=MATCHES.filter(function(m){
    if(grpFilter!=="ALL"&&m.grp!==grpFilter) return false;
    if(hideStarted&&m.kt<=now) return false;
    if(tf&&!m.h.toLowerCase().includes(tf)&&!m.a.toLowerCase().includes(tf)) return false;
    return true;
  });
  if(!list.length){html+='<div class="empty"><div class="big">'+esc(t("nothing_here_big"))+'</div>'+esc(t("nothing_here_sub"))+'</div>';}
  var lastDay="";
  list.forEach(function(m){
    var dk=dayKey(m.kt);
    if(dk!==lastDay){html+='<div class="day-h">'+fmtDay(m.kt)+'</div>';lastDay=dk;}
    html+=matchCard(m,now);
  });
  v.innerHTML=html;
  v.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){grpFilter=c.getAttribute("data-g");renderMatches();};});
  var hc=$("#hideChk");if(hc)hc.onchange=function(){hideStarted=hc.checked;renderMatches();};
  var ts=v.querySelector(".team-search");
  if(ts){
    ts.oninput=function(){teamFilter=ts.value;renderMatches();};
    if(hadSearchFocus){ts.focus();ts.setSelectionRange(ts.value.length,ts.value.length);}
  }
  bindCards(v);
}

function matchCard(m,now){
  var open=now<m.kt;
  var res=results[m.id],bet=myBets[m.id];
  var live=!open&&!res&&(now<m.kt+3*3600*1000);
  var sCls=res?"done":(open?"open":(live?"live":"locked"));
  var sTxt=res?t("status_final"):(open?t("status_open"):(live?t("status_live"):t("status_locked")));
  var h='<div class="card" data-id="'+m.id+'">';
  h+='<div class="meta"><span class="gbadge">'+m.grp+'</span><span class="time">'+fmtTime(m.kt)+'</span>'+
    '<span class="status '+sCls+'">'+esc(sTxt)+'</span></div>';
  h+='<div class="match">'+
    '<div class="team home"><span class="flag">'+fl(rn(m,'h'))+'</span><span class="tname">'+esc(rn(m,'h'))+'</span></div>'+
    '<div class="vs">VS</div>'+
    '<div class="team away"><span class="flag">'+fl(rn(m,'a'))+'</span><span class="tname">'+esc(rn(m,'a'))+'</span></div></div>';
  if(open&&me){
    var bh=bet?bet.h:"",ba=bet?bet.a:"";
    h+='<div class="betrow">'+
      '<input class="score-in" type="number" inputmode="numeric" min="0" max="99" placeholder="0" data-side="h" value="'+bh+'">'+
      '<span class="dash">:</span>'+
      '<input class="score-in" type="number" inputmode="numeric" min="0" max="99" placeholder="0" data-side="a" value="'+ba+'">'+
      '<button class="save'+(bet?" saved":"")+'" data-save>'+(bet?t("saved_btn"):t("save_btn"))+'</button></div>';
  } else if(open&&!me){
    h+='<div class="result-line"><span class="nobet">'+esc(t("pick_name_notice"))+'</span></div>';
  } else {
    var line='<div class="result-line">';
    if(bet){line+='<span class="pill you"><span class="lab">'+esc(t("your_tip_lab"))+'</span>'+bet.h+'–'+bet.a+'</span>';}
    else{line+='<span class="nobet">'+esc(t("no_prediction"))+'</span>';}
    if(res){
      line+='<span class="pill final"><span class="lab">'+esc(t("result_lab"))+'</span>'+res.h+'–'+res.a+'</span>';
      var p=scorePoints(bet,res);
      if(p!==null){line+='<span class="pts p'+p+'">+'+p+'</span>';}
    }
    line+='</div>'; h+=line;
    if(roster.length>1){
      var tips='<div class="pool-tips"><span class="tips-label">'+esc(t("pool_picks_lab"))+'</span>';
      roster.forEach(function(name){
        var b=(name===me)?bet:((allBets[name]||{})[m.id]||null);
        var isMine=(name===me);
        tips+='<span class="tip-chip'+(isMine?' mine':'')+'">'+
          '<span class="tip-nm">'+esc(isMine?t("you_lbl"):name)+'</span>'+
          (b?'<span class="tip-sc">'+esc(b.h)+'–'+esc(b.a)+'</span>':'<span class="tip-no">—</span>');
        if(b&&res){var tp=scorePoints(b,res);tips+='<span class="pts p'+tp+'">+'+tp+'</span>';}
        tips+='</span>';
      });
      tips+='</div>';
      h+=tips;
    }
  }
  return h+'</div>';
}

function bindCards(root){
  root.querySelectorAll(".card").forEach(function(card){
    var btn=card.querySelector("[data-save]");if(!btn)return;
    var ins=card.querySelectorAll(".score-in");
    ins.forEach(function(inp){inp.addEventListener("input",function(){btn.classList.remove("saved");btn.textContent=t("save_btn");});});
    btn.onclick=async function(){
      if(btn.disabled)return;
      var id=card.getAttribute("data-id");
      var h=parseInt(card.querySelector('[data-side="h"]').value,10);
      var a=parseInt(card.querySelector('[data-side="a"]').value,10);
      if(isNaN(h)||isNaN(a)||h<0||a<0){toast(t("toast_enter_both_scores"));return;}
      btn.disabled=true; btn.textContent=t("saving_btn");
      var prev=myBets[id];
      myBets[id]={h:h,a:a};
      if(!allBets[me])allBets[me]={};allBets[me][id]={h:h,a:a};
      var saved=false, saveErr=null;
      try{
        try{
          await apiPost({action:"saveBet",poolId:currentPool.id,playerName:me,playerToken:myToken,matchId:id,h:h,a:a});
          saved=true;
        }catch(e){
          var tokenErr=e.message&&(e.message.includes("Invalid token")||e.message.includes("Player not found"));
          if(tokenErr){
            // Token is stale or player missing — re-register then retry once
            pset("token",null); myToken=null;
            var tok=genUUID();
            var reg=await apiPost({action:"register",name:me,token:tok});
            myToken=reg.token||tok; pset("token",myToken);
            await apiPost({action:"saveBet",poolId:currentPool.id,playerName:me,playerToken:myToken,matchId:id,h:h,a:a});
            saved=true;
          } else {
            throw e;
          }
        }
      }catch(err){saveErr=err;}
      finally{
        btn.disabled=false;
        if(saved){
          btn.classList.add("saved"); btn.textContent=t("saved_btn");
          toast(t("toast_prediction_saved"));
        } else {
          if(prev) myBets[id]=prev; else delete myBets[id];
          if(allBets[me]) delete allBets[me][id];
          btn.textContent=t("save_btn");
          toast(errMsg(saveErr)||t("toast_couldnt_save"));
        }
      }
    };
  });
}

/* ── Leaderboard ──────────────────────────────────────────── */
async function renderBoard(){
  var v=$("#view-board");
  v.innerHTML='<div class="empty"><div class="big">'+esc(t("loading_big"))+'</div>'+esc(t("tallying"))+'</div>';
  var loaded=await Promise.all([
    apiGet({action:"members",poolId:currentPool.id}).then(function(d){return d.players||[];}).catch(function(){return[];}),
    apiGet({action:"results",poolId:currentPool.id}).then(function(d){return d.results||{};}).catch(function(){return{};}),
    apiGet({action:"allbets",poolId:currentPool.id}).then(function(d){return d.bets||{};}).catch(function(){return{};})
  ]);
  roster=loaded[0]; results=loaded[1]; allBets=loaded[2];
  var resCount=Object.keys(results).length;
  if(!roster.length){v.innerHTML='<div class="empty"><div class="big">'+esc(t("no_players_big"))+'</div>'+esc(t("share_invite"))+'</div>';return;}
  var rows=[];
  roster.forEach(function(name){
    var bets=(name===me)?myBets:(allBets[name]||{});
    var pts=0,exact=0,played=0;
    MATCHES.forEach(function(m){
      if(results[m.id]&&bets[m.id]){
        var p=scorePoints(bets[m.id],results[m.id]);
        pts+=p;if(p===3)exact++;played++;
      }
    });
    rows.push({name:name,pts:pts,exact:exact,played:played});
  });
  rows.sort(function(x,y){return y.pts-x.pts||y.exact-x.exact||x.name.localeCompare(y.name);});
  var html="";
  if(!resCount){
    html+='<div class="pnl" style="text-align:center"><h2>'+th("h2_kickoff_pending")+'</h2>'+
      '<p>'+esc(t("kickoff_pending_p"))+'</p></div>';
  }
  html+='<div class="lb"><div class="lb-row head"><div>#</div><div>'+esc(t("lb_player"))+'</div>'+
    '<div style="text-align:right">'+esc(t("lb_exact"))+'</div><div style="text-align:right">'+esc(t("lb_pts"))+'</div></div>';
  rows.forEach(function(r,i){
    html+='<div class="lb-row"><div class="rank">'+(i+1)+'</div>'+
      '<div class="lb-name">'+esc(r.name)+(r.name===me?'<span class="meflag">'+esc(t("you_marker"))+'</span>':'')+'</div>'+
      '<div class="lb-sub">'+r.exact+' / '+r.played+'</div>'+
      '<div class="lb-pts">'+r.pts+'</div></div>';
  });
  html+='</div><div class="hint" style="text-align:center">'+esc(t("matches_have_results",{count:resCount,total:MATCHES.length}))+'</div>';
  v.innerHTML=html;
}

/* ── My Picks ─────────────────────────────────────────────── */
function renderMyPicks(){
  var v=$("#view-mypicks");
  if(!me){
    v.innerHTML='<div class="empty"><div class="big">'+esc(t("no_name_big"))+'</div>'+esc(t("no_name_sub"))+'</div>';
    return;
  }
  var totalPts=0,exact=0,played=0;
  var cards=[];
  MATCHES.forEach(function(m){
    var bet=myBets[m.id],res=results[m.id];
    if(!bet&&!res) return;
    var p=null;
    if(bet&&res){p=scorePoints(bet,res);totalPts+=p;if(p===3)exact++;played++;}
    cards.push({m:m,bet:bet,res:res,p:p});
  });
  var html='';
  html+='<div class="mypicks-summary">'+
    '<div class="mps-item"><div class="mps-val">'+totalPts+'</div><div class="mps-lab">'+esc(t("pts_lab"))+'</div></div>'+
    '<div class="mps-item"><div class="mps-val">'+exact+'</div><div class="mps-lab">'+esc(t("exact_lab"))+'</div></div>'+
    '<div class="mps-item"><div class="mps-val">'+played+' / '+Object.keys(myBets).length+'</div><div class="mps-lab">'+esc(t("scored_picks_lab"))+'</div></div>'+
    '</div>';
  if(!cards.length){
    html+='<div class="empty"><div class="big">'+esc(t("nothing_yet_big"))+'</div>'+esc(t("nothing_yet_sub"))+'</div>';
    v.innerHTML=html; return;
  }
  var lastDay='';
  cards.forEach(function(c){
    var dk=dayKey(c.m.kt);
    if(dk!==lastDay){html+='<div class="day-h">'+fmtDay(c.m.kt)+'</div>';lastDay=dk;}
    html+='<div class="mypick-card">'+
      '<div class="mpc-teams">'+fl(rn(c.m,'h'))+'<span class="mpc-name">'+esc(rn(c.m,'h'))+'</span>'+
      '<span class="mpc-vs">VS</span>'+
      '<span class="mpc-name">'+esc(rn(c.m,'a'))+'</span>'+fl(rn(c.m,'a'))+'</div>'+
      '<div class="mpc-row">';
    if(c.bet){html+='<span class="pill you"><span class="lab">'+esc(t("your_pick_lab"))+'</span>'+esc(c.bet.h)+'–'+esc(c.bet.a)+'</span>';}
    else{html+='<span class="nobet">'+esc(t("no_pick"))+'</span>';}
    if(c.res){
      html+='<span class="pill final"><span class="lab">'+esc(t("result_lab"))+'</span>'+esc(c.res.h)+'–'+esc(c.res.a)+'</span>';
      if(c.p!==null) html+='<span class="pts p'+c.p+'">+'+c.p+'</span>';
    } else {
      html+='<span class="mpc-pending">'+esc(t("pending_lbl"))+'</span>';
    }
    html+='</div></div>';
  });
  v.innerHTML=html;
}

/* ── Organizer ────────────────────────────────────────────── */
function renderOrg(){
  var v=$("#view-org");
  if(!orgUnlocked){
    v.innerHTML='<div class="pnl"><h2>'+th("h2_org_login")+'</h2>'+
      '<p>'+esc(t("org_login_p"))+'</p>'+
      '<div class="row-in"><input class="txt" id="codeIn" placeholder="'+esc(t("org_code_input_ph"))+'" style="flex:1;min-width:180px">'+
      '<button class="btn" id="codeGo">'+esc(t("unlock_btn"))+'</button></div>'+
      '<div class="hint">'+esc(t("org_not_org"))+'</div></div>';
    $("#codeGo").onclick=async function(){
      var code=($("#codeIn").value||"").trim();if(!code)return;
      var d=await apiPost({action:"verifyOrgCode",poolId:currentPool.id,code:code}).catch(function(){return{valid:false};});
      if(d.valid){orgUnlocked=true;orgCode=code;toast(t("toast_unlocked"));renderOrg();}
      else toast(t("toast_wrong_code"));
    };
    $("#codeIn").addEventListener("keydown",function(e){if(e.key==="Enter")$("#codeGo").click();});
    return;
  }
  var now=Date.now();
  var KO_GROUPS=["R32","R16","QF","SF","3P","FIN"];
  var koMatches=MATCHES.filter(function(m){return KO_GROUPS.indexOf(m.grp)!==-1;});
  var html='<div class="pnl"><h2>'+th("h2_ko_teams")+'</h2>'+
    '<p>'+esc(t("ko_teams_p"))+'</p>';
  koMatches.forEach(function(m){
    html+='<div class="ko-row" data-ko="'+m.id+'">'+
      '<span class="gbadge" style="flex:0 0 auto">'+m.grp+'</span>'+
      '<input class="txt ko-h" value="'+esc(rn(m,'h'))+'" placeholder="'+esc(t("home_team_ph"))+'" style="flex:1;min-width:80px">'+
      '<span style="color:var(--mut);font-weight:800;padding:0 4px">vs</span>'+
      '<input class="txt ko-a" value="'+esc(rn(m,'a'))+'" placeholder="'+esc(t("away_team_ph"))+'" style="flex:1;min-width:80px">'+
      '<button class="btn ko-save" style="flex:0 0 auto">'+esc(t("set_btn"))+'</button>'+
      '</div>';
  });
  html+='</div>';
  html+='<div class="pnl"><h2>'+th("h2_log_results")+'</h2>'+
    '<p>'+esc(t("log_results_p"))+'</p></div>';
  var lastDay="";
  MATCHES.forEach(function(m){
    var dk=dayKey(m.kt);
    if(dk!==lastDay){html+='<div class="day-h">'+fmtDay(m.kt)+'</div>';lastDay=dk;}
    var r=results[m.id],started=m.kt<=now;
    html+='<div class="card" data-rid="'+m.id+'">'+
      '<div class="meta"><span class="gbadge">'+m.grp+'</span><span class="time">'+fmtTime(m.kt)+'</span>'+
      (r?'<span class="status done">'+esc(t("status_logged"))+'</span>':(started?'<span class="status live">'+esc(t("status_awaiting"))+'</span>':'<span class="status locked">'+esc(t("status_upcoming"))+'</span>'))+'</div>'+
      '<div class="match">'+
      '<div class="team home"><span class="flag">'+fl(rn(m,'h'))+'</span><span class="tname">'+esc(rn(m,'h'))+'</span></div>'+
      '<div class="vs">VS</div>'+
      '<div class="team away"><span class="flag">'+fl(rn(m,'a'))+'</span><span class="tname">'+esc(rn(m,'a'))+'</span></div></div>'+
      '<div class="betrow">'+
      '<input class="score-in" type="number" inputmode="numeric" min="0" max="99" data-rs="h" value="'+(r?r.h:"")+'">'+
      '<span class="dash">:</span>'+
      '<input class="score-in" type="number" inputmode="numeric" min="0" max="99" data-rs="a" value="'+(r?r.a:"")+'">'+
      '<button class="save'+(r?" saved":"")+'" data-rsave>'+(r?esc(t("logged_btn")):esc(t("log_btn")))+'</button>'+
      (r?'<button class="save" data-rclear style="background:transparent;color:var(--coral);border:1px solid rgba(255,90,60,.4)">'+esc(t("clear_btn"))+'</button>':'')+
      '</div></div>';
  });
  v.innerHTML=html;
  v.querySelectorAll(".ko-row").forEach(function(row){
    var id=row.getAttribute("data-ko");
    var btn=row.querySelector(".ko-save");
    btn.onclick=async function(){
      var h=(row.querySelector(".ko-h").value||"").trim();
      var a=(row.querySelector(".ko-a").value||"").trim();
      if(!h||!a){toast(t("toast_enter_both_teams"));return;}
      btn.disabled=true; btn.textContent=t("saving_lbl");
      try{
        await apiPost({action:"saveMatchName",poolId:currentPool.id,matchId:id,home:h,away:a,code:orgCode});
        if(!matchOverrides[id])matchOverrides[id]={};
        matchOverrides[id].h=h; matchOverrides[id].a=a;
        btn.textContent=t("saved_btn"); toast(t("toast_teams_updated"));
      }catch(e){toast(errMsg(e)||t("toast_couldnt_save_set"));btn.textContent=t("set_btn");}
      finally{btn.disabled=false;}
    };
  });
  v.querySelectorAll(".card").forEach(function(card){
    var id=card.getAttribute("data-rid");
    var sBtn=card.querySelector("[data-rsave]");
    var cBtn=card.querySelector("[data-rclear]");
    card.querySelectorAll(".score-in").forEach(function(inp){
      inp.addEventListener("input",function(){sBtn.classList.remove("saved");sBtn.textContent=t("log_btn");});
    });
    sBtn.onclick=async function(){
      if(sBtn.disabled)return;
      var h=parseInt(card.querySelector('[data-rs="h"]').value,10);
      var a=parseInt(card.querySelector('[data-rs="a"]').value,10);
      if(isNaN(h)||isNaN(a)||h<0||a<0){toast(t("toast_enter_both_scores"));return;}
      sBtn.disabled=true; sBtn.textContent=t("saving_lbl");
      try{
        await apiPost({action:"saveResult",poolId:currentPool.id,matchId:id,h:h,a:a,code:orgCode});
        results[id]={h:h,a:a};
        sBtn.classList.add("saved"); sBtn.textContent=t("logged_btn");
        toast(t("toast_result_saved"));
        renderOrg();
      }catch(e){
        toast(errMsg(e)||t("toast_couldnt_save"));
        sBtn.textContent=t("log_btn");
      }finally{sBtn.disabled=false;}
    };
    if(cBtn) cBtn.onclick=async function(){
      await apiPost({action:"clearResult",poolId:currentPool.id,matchId:id,code:orgCode}).catch(function(){});
      delete results[id]; toast(t("toast_cleared")); renderOrg();
    };
  });
}

$("#tabs").addEventListener("click",function(e){
  var b=e.target.closest(".tab");if(!b)return;
  curTab=b.getAttribute("data-tab");
  document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("active",t===b);});
  ["matches","mypicks","board","rules","invite","org"].forEach(function(k){
    $("#view-"+k).style.display=(k===curTab)?"block":"none";
  });
  if(curTab==="matches") renderMatches();
  if(curTab==="mypicks") renderMyPicks();
  if(curTab==="board") renderBoard();
  if(curTab==="rules") renderRules();
  if(curTab==="invite") renderInvite();
  if(curTab==="org") renderOrg();
});

init();
